name: Free AI Blog Generator

on:
  schedule:
    - cron: '0 8 * * *'  # Runs automatically once every day at 8:00 AM UTC
  workflow_dispatch:     # Enables manual execution anytime via a button

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Post using Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate

      - name: Commit and Push Generated Post
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-generated blog post [skip ci]"
          branch: main
